name: .22 Bot Debug

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # every 15 minutes for quick testing (you can adjust)

jobs:
  run-bot-debug:
    runs-on: ubuntu-latest
    env:
      MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run bot (no timeout)
        run: npm start

      - name: Upload bot_data artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot_data
          path: ./output/bot_data.json
