name: .22 Bot Debug Minimal

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes

jobs:
  run-bot-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 6  # max job runtime (6 mins)
    env:
      MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run bot for 4 minutes then stop
        run: |
          npm start &
          BOT_PID=$!
          echo "Bot started with PID $BOT_PID"
          sleep 240  # run bot for 4 minutes
          echo "Stopping bot"
          kill $BOT_PID
          wait $BOT_PID || true

      - name: List all files in root directory
        run: ls -lR . || echo "Failed to list root directory"

      - name: List files in output folder
        run: ls -l ./output || echo "Output folder does not exist"

      - name: Check bot_data.json existence and details
        run: |
          if [ -f ./output/bot_data.json ]; then
            echo "bot_data.json found:"
            ls -l ./output/bot_data.json
          else
            echo "bot_data.json NOT found"
          fi

      - name: Upload bot_data artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot_data
          path: ./output/bot_data.json
