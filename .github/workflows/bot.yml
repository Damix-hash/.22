name: .22 Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Dependencies
        run: npm install
      
      - name: Run Bot for 10 minutes then stop
        run: |
          npm start &
          BOT_PID=$!
          sleep 600
          kill -SIGTERM $BOT_PID
          wait $BOT_PID || true

      - name: Upload bot_data artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot_data
          path: ./output/bot_data.json

  save-artifact-to-repo:
    needs: run-bot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout storage repo
        uses: actions/checkout@v3
        with:
          repository: Damix-hash/.22-archive
          token: ${{ secrets.STORAGE_REPO_TOKEN }}
          path: storage-repo

      - name: Download bot_data artifact
        uses: actions/download-artifact@v4
        with:
          name: bot_data
          path: storage-repo

      - name: Commit and push bot_data.json
        run: |
          cd storage-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_data.json
          git commit -m "Update bot_data.json from workflow" || echo "No changes to commit"
          git push
