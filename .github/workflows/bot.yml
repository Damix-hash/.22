name: .22 Main Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370  # 6h + buffer
    env:
      MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run bot for 6 hours then stop
        run: |
          npm start &
          BOT_PID=$!
          echo "Bot started with PID $BOT_PID"
          sleep $((6 * 60 * 60))  # 6 hours
          echo "Stopping bot"
          kill $BOT_PID
          wait $BOT_PID || true

      - name: Clone archive repo
        run: |
          git clone https://x-access-token:${{ secrets.STORAGE_REPO_TOKEN }}@github.com/Damix-hash/.22-archive.git archive-repo

      - name: Copy output files to archive repo
        run: |
          mkdir -p archive-repo/output
          cp -r output/* archive-repo/output/ || echo "No output files to copy"

      - name: Commit and push to archive repo
        run: |
          cd archive-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "Auto-save bot_data.json from main bot run [ci skip]" || echo "No changes to commit"
          git push origin main
